<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Grid Quiz</title>
<style>
:root{--bg:#eef0f8;--surface:#fff;--ink:#1b1f3b;--muted:#5d6385;--line:#d3d7ea;--accent:#e0457b;--accent-ink:#fff;--sel:#e0457b;--cell:#e4e7f5}
@media (prefers-color-scheme:dark){:root{--bg:#13152a;--surface:#1c1f3a;--ink:#eceefb;--muted:#a1a7cf;--line:#343862;--accent:#ff6a9f;--accent-ink:#1b1f3b;--cell:#262a4d}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.board{display:grid;grid-template-columns:1fr 1fr 1fr 84px;gap:6px}
.cell{aspect-ratio:1;background:var(--cell);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;font-size:.8rem;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.rl{display:flex;align-items:center;font-weight:800;font-size:.85rem;color:var(--accent)}
.cl{text-align:center;font-weight:800;font-size:.85rem;color:var(--accent);padding-top:2px}
.ask{font-weight:700;margin:18px 0 10px}
.opts{display:grid;gap:8px}
button,input{font:inherit}
button{cursor:pointer}
.opt{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--sel);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.opt:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:14px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 22px;font-weight:800}
.go.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.go:disabled{opacity:.45;cursor:default}
input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:12px}
.err{color:#d2433d;min-height:1.5em;margin:8px 0 0}
.big{font-size:3rem;font-weight:800;margin:6px 0}
.hide{display:none}
@media (max-width:420px){.board{grid-template-columns:1fr 1fr 1fr 60px}.cell{font-size:.7rem}.rl{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Anime Grid Quiz</h1>

  <section id="intro">
    <p class="sub">Each row and column shares one trait. Find the anime that fits every clue. Answers are checked after you submit.</p>
    <input id="name" maxlength="40" placeholder="Your name" autocomplete="name">
    <button class="go" id="begin">Start quiz</button>
    <p class="err" id="err0"></p>
  </section>

  <section id="quiz" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <div class="meta" id="count"></div>
    <div class="board" id="board"></div>
    <p class="ask">Which anime fits all six clues?</p>
    <div class="opts" id="opts"></div>
    <div class="row">
      <button class="go alt" id="prev">Back</button>
      <button class="go" id="next">Next</button>
    </div>
    <p class="err" id="err1" aria-live="polite"></p>
  </section>

  <section id="end" class="hide">
    <h2 id="endTitle">Submitted</h2>
    <div class="big" id="final"></div>
    <p class="sub" id="endMsg"></p>
  </section>
</main>

<script>
/* 1. Paste your Apps Script web app URL here (see the setup guide). */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbzZXTWaDRxV9YnF8S37ac_gT8yn4ewDVaW-nIEZbwjLfO7OTis7WP4J_QBdMfEMiH2s/exec";

/* 2. Your questions. NO answers go here: the answer key lives only in your Google Sheet.
   id: must match the id in the sheet's Key tab.
   cells: 9 items, row by row. A title string, or {t:"Title", img:"images/q1.webp"}. */
const QUESTIONS = [
  {
    id: "q1",
    cells:["Kagami no Kojou","Angel Heart","Koukaku Kidoutai","Shinsekai yori","Beastars","Btooom!","Qualidea Code","Sakamoto desu ga?","Dagashi Kashi"],
    rows:["Genre","Theme","Premiere In"], cols:["Studio","Type","Source"],
    options:["Boku dake ga Inai Machi","Ajin","Glass no Hana to Kowasu Sekai","Mayoiga","Dance in the Vampire Bund"]
  },
  {
    id: "q2",
    cells:["Sayonara Zetsubou Sensei","Madoka Magica","Arakawa Under the Bridge","Highschool of the Dead","Sora no Woto","Bakuman.","Prison School","Highschool DxD","Elfen Lied"],
    rows:["Studio","Aired in","Rating"], cols:["Demographic","Episodes","Source"],
    options:["Dance in the Vampire Bund","Highschool of the Dead","Prison School","Madoka Magica","Elfen Lied"]
  }
];

const $ = id => document.getElementById(id);
let order, i, picks, player;

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

$("begin").onclick = () => {
  player = $("name").value.trim();
  if(player.length < 2){ $("err0").textContent = "Enter your name to start."; return; }
  order = shuffle(QUESTIONS).map(q => Object.assign({}, q, {options: shuffle(q.options)}));
  picks = {}; i = 0;
  $("intro").classList.add("hide"); $("quiz").classList.remove("hide");
  show();
};

function show(){
  const q = order[i];
  $("count").textContent = "Question " + (i+1) + " of " + order.length;
  $("fill").style.width = (i/order.length*100) + "%";
  $("err1").textContent = "";
  $("prev").disabled = i === 0;
  $("next").textContent = i === order.length-1 ? "Submit answers" : "Next";

  const b = $("board"); b.textContent = "";
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      const v = q.cells[r*3+c], d = document.createElement("div");
      d.className = "cell";
      if(typeof v === "object" && v.img){ const im = new Image(); im.src = v.img; im.alt = v.t || ""; d.appendChild(im); }
      else d.textContent = typeof v === "object" ? v.t : v;
      b.appendChild(d);
    }
    const rl = document.createElement("div"); rl.className = "rl"; rl.textContent = q.rows[r]; b.appendChild(rl);
  }
  q.cols.forEach(t => { const d = document.createElement("div"); d.className = "cl"; d.textContent = t; b.appendChild(d); });
  b.appendChild(document.createElement("div"));

  const o = $("opts"); o.textContent = "";
  q.options.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "opt" + (picks[q.id] === t ? " on" : ""); btn.textContent = t;
    btn.onclick = () => { picks[q.id] = t; show(); };
    o.appendChild(btn);
  });
}

$("prev").onclick = () => { if(i > 0){ i--; show(); } };
$("next").onclick = () => {
  const q = order[i];
  if(!picks[q.id]){ $("err1").textContent = "Pick an answer to continue."; return; }
  if(i < order.length-1){ i++; show(); } else submit();
};

async function post(){
  const body = JSON.stringify({name: player, answers: picks});
  const res = await fetch(SUBMIT_URL, {method:"POST", body: body});
  return res.json();
}

async function submit(){
  if(SUBMIT_URL.indexOf("PASTE_") === 0){ $("err1").textContent = "Setup needed: add your web app URL in index.html."; return; }
  $("next").disabled = true; $("prev").disabled = true; $("err1").textContent = "Submitting…";
  let out;
  try { out = await post(); } catch(e) { try { out = await post(); } catch(e2) { out = null; } }
  if(!out){ $("err1").textContent = "Could not submit. Check your connection and try again."; $("next").disabled = false; $("prev").disabled = false; return; }
  if(out.error){ $("err1").textContent = out.error; $("next").disabled = false; $("prev").disabled = false; return; }
  $("quiz").classList.add("hide"); $("end").classList.remove("hide");
  $("endMsg").textContent = "Thanks, " + player + ". Your answers were received.";
  if(typeof out.score === "number") $("final").textContent = out.score + " / " + out.total;
}
</script>
</body>
</html>
