<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Grid Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f8;--surface:#fff;--ink:#1b1f3b;--muted:#5d6385;--line:#d3d7ea;--accent:#e0457b;--accent-ink:#fff;--good:#1f9d6b;--bad:#d2433d;--cell:#e4e7f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13152a;--surface:#1c1f3a;--ink:#eceefb;--muted:#a1a7cf;--line:#343862;--accent:#ff6a9f;--accent-ink:#1b1f3b;--good:#4cd49a;--bad:#ff7a73;--cell:#262a4d}}
:root[data-theme="dark"]{--bg:#13152a;--surface:#1c1f3a;--ink:#eceefb;--muted:#a1a7cf;--line:#343862;--accent:#ff6a9f;--accent-ink:#1b1f3b;--good:#4cd49a;--bad:#ff7a73;--cell:#262a4d}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.board{display:grid;grid-template-columns:1fr 1fr 1fr 84px;gap:6px;align-items:stretch}
.cell{aspect-ratio:1;background:var(--cell);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;font-size:.8rem;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.rl{display:flex;align-items:center;font-weight:800;font-size:.85rem;color:var(--accent)}
.cl{text-align:center;font-weight:800;font-size:.85rem;color:var(--accent);padding-top:2px}
.ask{font-weight:700;margin:18px 0 10px}
.opts{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.opt{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.opt:disabled{cursor:default}
.note{margin:14px 0 0;color:var(--muted);min-height:3em}
.go{margin-top:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 22px;font-weight:800}
.score{font-size:3rem;font-weight:800;margin:6px 0}
.rev{list-style:none;padding:0;margin:16px 0}
.rev li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface);font-size:.92rem}
.rev b.ok{color:var(--good)}.rev b.no{color:var(--bad)}
.hide{display:none}
@media (max-width:420px){.board{grid-template-columns:1fr 1fr 1fr 60px}.cell{font-size:.7rem}.rl{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Anime Grid Quiz</h1>
  <p class="sub">Each row and column shares one trait. Find the anime that fits every clue.</p>

  <section id="quiz">
    <div class="bar"><i id="fill"></i></div>
    <div class="meta"><span id="count"></span><span id="sc"></span></div>
    <div class="board" id="board"></div>
    <p class="ask">Which anime fits all six clues?</p>
    <div class="opts" id="opts"></div>
    <p class="note" id="note" aria-live="polite"></p>
    <button class="go hide" id="next">Next question</button>
  </section>

  <section id="end" class="hide">
    <h2>Your score</h2>
    <div class="score" id="final"></div>
    <p id="msg" class="sub"></p>
    <ul class="rev" id="rev"></ul>
    <button class="go" id="again">Play again</button>
  </section>
</main>

<script>
/* ADD YOUR QUESTIONS HERE.
   cells: 9 items, row by row. Each is a title string, or {t:"Title", img:"data:image/jpeg;base64,..."}.
   Published pages block remote images, so embed images as data: URIs.
   rows: 3 row clues (right side). cols: 3 column clues (bottom).
   These samples are drafts: verify every answer before sharing. */
const QUESTIONS = [
  {
    cells:["Kagami no Kojou","Angel Heart","Koukaku Kidoutai","Shinsekai yori","Beastars","Btooom!","Qualidea Code","Sakamoto desu ga?","Dagashi Kashi"],
    rows:["Genre","Theme","Premiere In"], cols:["Studio","Type","Source"],
    options:["Boku dake ga Inai Machi","Ajin","Glass no Hana to Kowasu Sekai","Mayoiga","Dance in the Vampire Bund"],
    answer:"Boku dake ga Inai Machi",
    why:"Mystery, psychological, premiered 2016, a TV series adapted from a manga."
  },
  {
    cells:["Sayonara Zetsubou Sensei","Madoka Magica","Arakawa Under the Bridge","Highschool of the Dead","Sora no Woto","Bakuman.","Prison School","Highschool DxD","Elfen Lied"],
    rows:["Studio","Aired in","Rating"], cols:["Demographic","Episodes","Source"],
    options:["Dance in the Vampire Bund","Highschool of the Dead","Prison School","Madoka Magica","Elfen Lied"],
    answer:"Dance in the Vampire Bund",
    why:"Shaft, 2010, R+, seinen, 12 episodes, manga. Highschool of the Dead is the decoy: it fails only on studio."
  }
];

const $ = id => document.getElementById(id);
let order, i, score, log;

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

function start(){
  order = shuffle(QUESTIONS); i = 0; score = 0; log = [];
  $("end").classList.add("hide"); $("quiz").classList.remove("hide");
  show();
}

function show(){
  const q = order[i];
  $("count").textContent = "Question " + (i+1) + " of " + order.length;
  $("sc").textContent = "Score: " + score;
  $("fill").style.width = (i/order.length*100) + "%";
  $("note").textContent = ""; $("next").classList.add("hide");

  const b = $("board"); b.textContent = "";
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      const v = q.cells[r*3+c], d = document.createElement("div");
      d.className = "cell";
      if(typeof v === "object" && v.img){ const im = new Image(); im.src = v.img; im.alt = v.t || ""; d.appendChild(im); }
      else d.textContent = typeof v === "object" ? v.t : v;
      b.appendChild(d);
    }
    const rl = document.createElement("div"); rl.className = "rl"; rl.textContent = q.rows[r]; b.appendChild(rl);
  }
  q.cols.forEach(t => { const d = document.createElement("div"); d.className = "cl"; d.textContent = t; b.appendChild(d); });
  b.appendChild(document.createElement("div"));

  const o = $("opts"); o.textContent = "";
  shuffle(q.options).forEach(t => {
    const btn = document.createElement("button");
    btn.className = "opt"; btn.textContent = t;
    btn.onclick = () => pick(btn, t);
    o.appendChild(btn);
  });
}

function pick(btn, t){
  const q = order[i], ok = t === q.answer;
  document.querySelectorAll(".opt").forEach(x => {
    x.disabled = true;
    if(x.textContent === q.answer) x.classList.add("good");
  });
  if(!ok) btn.classList.add("bad");
  if(ok) score++;
  log.push({a:q.answer, ok:ok, you:t});
  $("sc").textContent = "Score: " + score;
  $("note").textContent = (ok ? "Correct. " : "Not quite. The answer is " + q.answer + ". ") + q.why;
  $("next").textContent = i === order.length-1 ? "See results" : "Next question";
  $("next").classList.remove("hide"); $("next").focus();
}

$("next").onclick = () => {
  i++;
  if(i < order.length) show(); else finish();
};

function finish(){
  $("quiz").classList.add("hide"); $("end").classList.remove("hide");
  $("final").textContent = score + " / " + order.length;
  const p = score / order.length;
  $("msg").textContent = p === 1 ? "Perfect run." : p >= .6 ? "Solid work. Try again for a perfect run." : "Tricky grids. Another round will help.";
  const r = $("rev"); r.textContent = "";
  log.forEach((l,n) => {
    const li = document.createElement("li");
    li.innerHTML = "<b class='" + (l.ok ? "ok" : "no") + "'>" + (l.ok ? "Correct" : "Missed") + "</b> " + l.a + (l.ok ? "" : " (you chose " + l.you + ")");
    r.appendChild(li);
  });
}

$("again").onclick = start;
start();
</script>
</body>
</html>
